name: 自检（每次提交都跑）

# 这个 CI 的定位：先证明"没犯错"，再证明"能打包"。
# 铁规：任何步骤都不许写 continue-on-error —— 旧 Agora 三步全开了这个开关，
#       结果红被伪装成"跳过"，真正的编译错误又被 tail 截断，等于没有 CI。
# 失败时必须把完整原因贴进日志和摘要，不许只给一句"失败了"。
# 检查规则一律写成 [[:space:]] 这种形式，是为了避免"正则匹配到自己这一行"。
#
# 记在这儿别再踩的四条：
#   1) jobs 下面的**键名**不能写中文（写成「自检:」会让 GitHub 解析失败：零 job、
#      日志全空、run 名字退化成文件路径）。中文只能写在给人看的 name: 里。
#   2) 触发器不要同时"不限分支 push"+"pull_request"，否则每个提交都跑两遍浪费机器。
#      现在的口径：往 main 直接提交时跑；开 PR 或 PR 有新提交时跑；
#      workbench/* 分支只要开了 PR 就有 CI，不再单独跑一遍。
#   3) 行数检查**不许**用 `xargs wc -l`：多文件时 wc 会额外打一行 `total`，
#      于是"全仓加起来刚过 1000 行"就被当成"某个文件超了 999 行"（真踩过，
#      报的还是 `1000 total` 这种连文件名都没有的行）。改成逐文件 `wc -l < 文件`。
#   4) 不要依赖 android-actions/setup-android 装环境：run 34903710256 起它自己崩
#      （`Failed to find package 'tools'`，sdkmanager 退出码 1），构建一行没跑就红。
#      ubuntu-latest 本来就带 SDK（ANDROID_HOME 已设），缺的组件让 AGP 自己下。
#      现在这一步只做"环境在不在"的断言，装不到就报得清清楚楚。
#
# 签名（2026-09-16 拍板「随便弄一个，要能覆盖安装」）：
#   覆盖安装认的是**钥匙**不是版本——换了钥匙系统直接拒装。所以 release.keystore
#   由 CI 首跑铸造一次并提交回仓（私有仓），此后每一次构建都是同一把钥匙。
#   这是对红线一的一次**公开、可审计的例外**：只写 signing/ 两个文件，
#   不含源码半个字节；检查里用「密钥首铸」标记排除，方便以后审计这一处。

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

# contents:write 只为「密钥首铸」的回推；其余一切照旧只读。
permissions:
  contents: write

concurrency:
  group: 自检-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zi-jian:
    name: 编译 + 测试 + 打包 + 四条红线
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 浅克隆的坑记牢（首铸首跑真踩过）：checkout 出来的是 PR 合并引用，
      # 直接在它上面提交再回推会被判 non-fast-forward——合并提交的父链在浅历史里够不到分支尖。
      # 所以铸钥提交必须**落在远端分支尖上**（fetch --depth=1 origin 分支 → 在尖上提交 → FF 回推），
      # 提交完回到原检出点，再把刚铸的钥匙带回来给本次构建用。
      - name: 签名密钥（首铸一次终身同一把——覆盖安装的命根子）
        env:
          KEY_PASS: hualuo-override-install-2026
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-main}"
          ORIG="$(git rev-parse HEAD)"
          git fetch --depth=1 origin "$BRANCH"
          # 先看远端有没有人已经铸过（并发/重跑的防呆），有就用仓库里那把，永不重铸
          if git cat-file -e "origin/$BRANCH:signing/release.keystore" 2>/dev/null; then
            git checkout "origin/$BRANCH" -- signing/
            echo "钥匙已在仓里，取来用（永不重新铸——换了钥匙覆盖安装就废了）"
            exit 0
          fi
          mkdir -p signing
          printf 'storeFile=signing/release.keystore\nstorePassword=%s\nkeyAlias=hualuo\nkeyPassword=%s\n' "$KEY_PASS" "$KEY_PASS" > signing/signing.properties
          keytool -genkeypair -v \
            -keystore signing/release.keystore \
            -alias hualuo -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Hualuo RepoTool, OU=Personal, O=hualuo, C=CN"
          TIP="$(git rev-parse "origin/$BRANCH")"
          git checkout -B mint-key "$TIP"
          git add signing
          git -c user.name="hualuo-key-mint" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "密钥首铸（终身一次：覆盖安装认钥匙不认版本，此后谁也不许换）"
          NEW_TIP="$(git rev-parse HEAD)"
          # 密钥首铸：全仓唯一允许的回推——只落 signing/ 两个文件，不碰源码
          git push origin "HEAD:refs/heads/$BRANCH" # 密钥首铸
          git checkout --force "$ORIG"
          git checkout "$NEW_TIP" -- signing/
          echo "钥匙已铸好并入库；本次构建用的就是它"

      - name: 装 Gradle（本仓不提交包装器二进制，版本在这里写死一次）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 确认安卓环境在（不在就直接报错，缺的组件交给构建自己下）
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-（没设）}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-（没设）}"
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "运行器里没有安卓 SDK 目录。这一步不猜、不静默装：直接红，去看运行器镜像。"
            exit 1
          fi
          ls "$ANDROID_HOME" | head -20

      - name: 红线一 · 禁止构建时改源码
        run: |
          set -uo pipefail
          echo "为什么查：旧 Agora 的构建会先用 python 重写源码，产物与仓库内容对不上，谁也没法审计。"
          echo "唯一例外（2026-09-16 拍板）：签名密钥首铸——只写 signing/ 两个文件、终身一次，"
          echo "不含源码半个字节；带「密钥首铸」标记的行被排除，让这处例外始终可见、可审计。"
          bad=$(grep -R -n -E 'python3?[[:space:]][^|;]*>+[[:space:]]*[^[:space:]]*\.kt|sed[[:space:]]+-i[^;]*\.kt|git[[:space:]]+push|gh[[:space:]]+api[[:space:]]+(contents|git/refs)' .github/workflows | grep -v '密钥首铸' || true)
          if [ -n "$bad" ]; then
            echo "发现"构建时改源码"或"CI 自己往仓库推东西"的写法："
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "没有（密钥首铸这一处公开例外之外）。构建只编译已经提交进来的字节。"

      - name: 红线二 · 禁止把整个文件读进内存
        run: |
          set -uo pipefail
          echo "为什么查：旧 Agora 传大文件闪退的根因就是把整个文件一次性读进内存，几个 G 必然撑爆。"
          bad=$(grep -R -n -E 'readAllBytes|[[:space:]]readBytes\(\)|toByteArray\(\)' engine app --include='*.kt' --exclude-dir=test || true)
          if [ -n "$bad" ]; then
            echo "出现整文件读入内存的写法："
            printf '%s\n' "$bad"
            echo "正确做法：用 com.hualuo.engine.io 里的 streamingCopy，一次搬 64 KiB。"
            exit 1
          fi
          echo "没有。正式代码全部走流式。"

      - name: 红线三 · 单文件不许超过 999 行
        run: |
          set -uo pipefail
          echo "为什么查：旧 Agora 有二十多个 20KB 以上的巨型文件（最大 57KB），补丁摞补丁，没人敢动。"
          over=""
          biggest=0
          biggest_name=""
          counted=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            counted=$((counted + 1))
            if [ "$n" -gt "$biggest" ]; then
              biggest=$n
              biggest_name=$f
            fi
            if [ "$n" -gt 999 ]; then
              over="$over$n  $f"$'\n'
            fi
          done < <(find engine app -type f \( -name '*.kt' -o -name '*.kts' \))
          echo "逐文件数过 $counted 个 .kt/.kts，最长的是 $biggest_name（$biggest 行）。"
          if [ -n "$over" ]; then
            echo "以下文件超过 999 行，必须拆开："
            printf '%s' "$over"
            exit 1
          fi
          echo "全部在 999 行以内。"

      - name: 红线四 · 版本号只能有一个来源
        run: |
          set -uo pipefail
          file_version=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version.properties 里写的：${file_version:-（空）}"
          if [ -z "$file_version" ]; then
            echo "version.properties 没写 versionName。"
            exit 1
          fi
          gradle_version=$(gradle -q :app:printVersion 2>/dev/null | sed -n 's/^versionName=//p' | tr -d '[:space:]')
          echo "构建实际生效的：${gradle_version:-（没读到）}"
          if [ -z "$gradle_version" ]; then
            echo "读不到构建版本号，说明构建脚本本身有问题（不是版本写了两处）。看后面步骤的完整日志。"
            exit 1
          fi
          if [ "$file_version" != "$gradle_version" ]; then
            echo "两边不一致：有第二处写死了版本号。以后改版本只许动 version.properties。"
            exit 1
          fi
          stray=$(grep -R -n -E 'versionName[[:space:]]*=[[:space:]]*"' app engine --include='*.kt' --include='*.kts' || true)
          if [ -n "$stray" ]; then
            echo "源码里还有写死的版本号："
            printf '%s\n' "$stray"
            exit 1
          fi
          echo "一致：全项目只有 version.properties 一处。"

      - name: 跑引擎测试（纯逻辑，不用手机；--rerun-tasks 禁缓存保真实+逐测试XML入档）
        run: |
          set -o pipefail
          mkdir -p 日志/测试结果
          gradle --no-daemon --stacktrace :engine:test --rerun-tasks 2>&1 | tee 日志/引擎测试.log
          cp engine/build/test-results/test/*.xml 日志/测试结果/ 2>/dev/null || echo "（无XML=无测试，红）"

      - name: 跑界面状态测试（纯 JVM：子页栈/多选删/附件账这些逻辑必须有人盯）
        run: |
          set -o pipefail
          mkdir -p 日志
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee 日志/界面测试.log

      - name: 打安卓包（debug 照旧；release 用仓里那把钥匙签名——覆盖安装用包）
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee 日志/打包.log

      - name: 确认包真的生成了、签名真的落上了
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          test -s "$apk"
          sha256sum "$apk" | tee 日志/安装包-debug.sha256
          cp "$apk" 日志/Hualuo-debug.apk
          rel=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$rel"
          test -s "$rel"
          sha256sum "$rel" | tee 日志/安装包-release.sha256
          cp "$rel" 日志/Hualuo-release-签名版.apk
          # 签名不是"应该签上了"，要当面对证：没有有效签名就不许叫发布包
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "$rel" | tee 日志/签名核对.txt
          echo "debug 包：$apk"
          echo "release 包：$rel，大小 $(stat -c%s "$rel") 字节"

      - name: 出错了就贴完整原因（不许 tail 截断）
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "# 失败现场"
            found=0
            for f in 日志/*.log; do
              [ -f "$f" ] || continue
              found=1
              size=$(wc -c < "$f")
              echo
              echo "## $f（共 ${size} 字节）"
              echo '```'
              if [ "$size" -gt 60000 ]; then
                head -c 20000 "$f"
                echo
                echo "……（中间省略 $(( size - 40000 )) 字节，完整内容在本 CI 产物 日志/ 里）……"
                echo
                tail -c 20000 "$f"
              else
                cat "$f"
              fi
              echo '```'
            done
            if [ "$found" -eq 0 ]; then
              echo "没有任何构建日志，说明挂在红线检查或环境检查阶段——请把上面失败的步骤名和它的日志发我。"
            fi
          } | tee "$GITHUB_STEP_SUMMARY"

      - name: 收日志（无条件上传；红了就修根因——腾配额，不跳过不逃避）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 自检日志-${{ github.run_id }}-${{ github.sha }}
          path: 日志/
          # 500MB 免费配额教训（#301）：日志留 3 天足够回看
          retention-days: 3
